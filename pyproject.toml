[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cua"
version = "0.1.0"
description = "Computer-Use Automation System — record-once, replay-many automation for legacy banking applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7.0",
    "playwright>=1.44.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "Pillow>=10.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
target-app = [
    "flask>=3.0.0",
]

[project.scripts]
cua = "cua.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
