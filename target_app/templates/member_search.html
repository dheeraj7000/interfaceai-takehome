<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; padding:10px; background:#F0F0F0; font-family:Verdana,sans-serif; font-size:12px; }
table.content { width:98%; margin:10px auto; background:#FFFFFF; border:1px solid #999; }
td.pagetitle { background:#003366; color:white; font-size:14px; font-weight:bold; padding:8px 12px; }
td.bodycell { padding:20px; }
table.frm { border:0; }
td.lbl { font-weight:bold; padding:4px 8px 4px 0; text-align:right; width:120px; color:#333; }
td.fld { padding:4px; }
input.t1 { border:1px solid #999; padding:3px 6px; font-size:12px; font-family:Verdana; width:200px; }
input.b1 { background:#003366; color:white; border:1px solid #003366; padding:4px 16px; font-size:12px; cursor:pointer; }
input.b1:hover { background:#004488; }
.errmsg { background:#FFE0E0; border:1px solid #CC0000; color:#CC0000; padding:8px 12px; margin:0 0 12px 0; font-weight:bold; }
.helptext { color:#888; font-size:10px; margin-top:4px; }
</style>
</head>
<body>
<table class="content" cellpadding="0" cellspacing="0" border="0">
<tr><td class="pagetitle">Member Search</td></tr>
<tr><td class="bodycell">

{% if error_msg %}
<div class="errmsg">{{ error_msg }}</div>
{% endif %}

<form method="POST" action="/member/search">
<table class="frm" cellpadding="0" cellspacing="0" border="0">
<tr>
  <td class="lbl">Member ID:</td>
  <td class="fld">
    <input type="text" name="memberid" class="t1" value="" maxlength="20" aria-label="Member ID">
    <div class="helptext">Format: M followed by digits (e.g. M1001)</div>
  </td>
</tr>
<tr>
  <td class="lbl">&nbsp;</td>
  <td class="fld" style="padding-top:10px;">
    <input type="submit" value="Search" class="b1">
    &nbsp;
    <input type="reset" value="Clear" class="b1" style="background:#666; border-color:#666;">
  </td>
</tr>
</table>
</form>

</td></tr>
</table>
</body>
</html>
