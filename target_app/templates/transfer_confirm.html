<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; padding:10px; background:#F0F0F0; font-family:Verdana,sans-serif; font-size:12px; }
table.content { width:98%; margin:10px auto; background:#FFFFFF; border:1px solid #999; }
td.pagetitle { background:#993300; color:white; font-size:14px; font-weight:bold; padding:8px 12px; }
td.bodycell { padding:20px; }
table.dtbl { width:50%; border-collapse:collapse; margin:12px 0; }
table.dtbl td { padding:6px 10px; border-bottom:1px solid #EEE; font-size:12px; }
table.dtbl td.dlbl { font-weight:bold; width:160px; color:#555; background:#FAFAFA; }
input.b1 { background:#CC3300; color:white; border:1px solid #CC3300; padding:6px 24px; font-size:13px; font-weight:bold; cursor:pointer; }
input.b1:hover { background:#DD4400; }
.warnbox { background:#FFEBEE; border:2px solid #CC3300; color:#CC3300; padding:10px 14px; margin:0 0 14px 0; font-weight:bold; }
</style>
</head>
<body>
<table class="content" cellpadding="0" cellspacing="0" border="0">
<tr><td class="pagetitle">⚠ CONFIRM TRANSFER</td></tr>
<tr><td class="bodycell">

<div class="warnbox">
You are about to execute an IRREVERSIBLE fund transfer. Please review the details below carefully.
</div>

<table class="dtbl" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="dlbl">From Account</td><td>{{ from_acct }}</td></tr>
  <tr><td class="dlbl">To Account</td><td>{{ to_acct }}</td></tr>
  <tr><td class="dlbl">Amount</td><td style="font-weight:bold; font-size:14px; color:#CC3300;">{{ amount }}</td></tr>
  {% if member %}
  <tr><td class="dlbl">Member</td><td>{{ member.id }} — {{ member.name }}</td></tr>
  {% endif %}
</table>

<br>

<form method="POST" action="/transfer/execute">
  <input type="hidden" name="from_account" value="{{ from_acct }}">
  <input type="hidden" name="to_account" value="{{ to_acct }}">
  <input type="hidden" name="amount" value="{{ amount }}">
  <input type="hidden" name="member_id" value="{{ member.id if member else '' }}">
  <input type="submit" value="CONFIRM AND EXECUTE TRANSFER" class="b1">
  &nbsp;&nbsp;
  <a href="/transfer{% if member %}?member_id={{ member.id }}{% endif %}" style="color:#666; font-size:12px;">Cancel — Go Back</a>
</form>

</td></tr>
</table>
</body>
</html>
